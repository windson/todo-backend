AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  todo-backend networking: a VPC with two private subnets across two
  Availability Zones for the Aurora PostgreSQL Serverless v2 cluster, plus the
  security groups that wire the Lambda Web Function VPC network-connector and
  the in-VPC CodeBuild project to Aurora on port 5432. A single public subnet
  hosts one NAT gateway that gives the private subnets OUTBOUND-ONLY internet
  egress, which the in-VPC CodeBuild build requires to clone the public GitHub
  source and install packages from public registries; nothing is reachable from
  the internet inbound and the Aurora security group stays closed. The Web
  Function reaches Aurora over the Lambda-managed network connector ENIs.

Parameters:
  VpcCidr:
    Type: String
    Default: "10.42.0.0/16"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: CIDR block for the VPC.
  PrivateSubnet1Cidr:
    Type: String
    Default: "10.42.1.0/24"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: CIDR block for the first private subnet (AZ 1).
  PrivateSubnet2Cidr:
    Type: String
    Default: "10.42.2.0/24"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: CIDR block for the second private subnet (AZ 2).
  PublicSubnetCidr:
    Type: String
    Default: "10.42.0.0/24"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: >-
      CIDR block for the single public subnet that hosts the NAT gateway. The
      NAT gateway gives the otherwise-private subnets outbound-only internet
      egress so that in-VPC CodeBuild can clone the public GitHub source and
      install packages from public registries (npm, Bun). No workload runs in
      this subnet and nothing is reachable from the internet inbound.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  # Flow logs give audit visibility into the otherwise-private VPC (cfn-guard
  # VPC_FLOW_LOGS_ENABLED). Logs land in CloudWatch via a dedicated role.
  FlowLogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vpc/${AWS::StackName}-flowlogs"
      RetentionInDays: 365

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flowlog-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogLogGroup.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-2"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Internet egress for the private subnets. CodeBuild runs inside the VPC (so
  # `prisma migrate deploy` can reach the private Aurora cluster), but the build
  # also has to clone the public GitHub source and install packages from public
  # registries, which require outbound internet access. AWS CodeBuild in a VPC
  # cannot use an internet gateway directly (it does not support public IPs on
  # the ENIs it creates) and therefore requires a NAT gateway for egress; see
  # https://docs.aws.amazon.com/codebuild/latest/userguide/vpc-support.html.
  # A single public subnet hosts one NAT gateway; the private route table sends
  # 0.0.0.0/0 to it. This is OUTBOUND-ONLY: nothing is reachable from the
  # internet inbound, Aurora keeps its closed security group, and the database
  # subnets remain private.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-nat"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"

  # Outbound-only default route for the private subnets via the NAT gateway.
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  # SG attached to the Lambda Web Function network-connector ENIs. It needs no
  # ingress; its egress to Aurora is authorized by the Aurora SG ingress rule
  # that references this group.
  WebFunctionConnectorSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Lambda Web Function VPC network connector ENIs.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref AuroraSg
          Description: Allow PostgreSQL egress to the Aurora cluster.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-webfn-connector-sg"

  # SG attached to the Aurora cluster. Only the Web Function connector SG may
  # reach 5432; there is no open-CIDR ingress.
  AuroraSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Aurora PostgreSQL cluster.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "127.0.0.1/32"
          Description: No egress required from the database tier.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-aurora-sg"

  AuroraIngressFromConnector:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AuroraSg
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref WebFunctionConnectorSg
      Description: Allow PostgreSQL ingress from the Web Function connector SG only.

  # SG attached to the CodeBuild VPC ENIs so `prisma migrate deploy` can reach
  # Aurora on 5432 from inside the VPC. CodeBuild also needs HTTPS egress to call
  # the Secrets Manager interface endpoint (and other AWS APIs reachable in-VPC).
  CodeBuildSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CodeBuild VPC ENIs running database migrations.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref AuroraSg
          Description: Allow PostgreSQL egress to the Aurora cluster for migrate deploy.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: Allow HTTPS egress to the in-VPC Secrets Manager endpoint and outbound-only internet (via NAT) for GitHub clone and public package registries.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-codebuild-sg"

  AuroraIngressFromCodeBuild:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AuroraSg
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref CodeBuildSg
      Description: Allow PostgreSQL ingress from the CodeBuild migrate SG only.

  # SG for the Secrets Manager interface VPC endpoint: accept HTTPS from the
  # CodeBuild SG so the in-VPC `get-secret-value` call resolves without NAT.
  SecretsManagerEndpointSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Secrets Manager interface VPC endpoint.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "127.0.0.1/32"
          Description: No egress required from the interface endpoint ENIs.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-secretsmanager-endpoint-sg"

  SecretsManagerEndpointIngressFromCodeBuild:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecretsManagerEndpointSg
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref CodeBuildSg
      Description: Allow HTTPS from the CodeBuild SG to the Secrets Manager endpoint.

  # Interface VPC endpoint so CodeBuild's get-secret-value resolves inside the
  # VPC without a NAT or internet gateway.
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref SecretsManagerEndpointSg

Outputs:
  VpcId:
    Description: The VPC id.
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PrivateSubnetIds:
    Description: Comma-separated private subnet ids for the DB subnet group and network connector.
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"
  AuroraSgId:
    Description: Security group id for the Aurora cluster.
    Value: !Ref AuroraSg
    Export:
      Name: !Sub "${AWS::StackName}-AuroraSgId"
  WebFunctionConnectorSgId:
    Description: Security group id for the Web Function VPC network connector.
    Value: !Ref WebFunctionConnectorSg
    Export:
      Name: !Sub "${AWS::StackName}-WebFunctionConnectorSgId"
  CodeBuildSgId:
    Description: Security group id for CodeBuild VPC ENIs running database migrations.
    Value: !Ref CodeBuildSg
    Export:
      Name: !Sub "${AWS::StackName}-CodeBuildSgId"
