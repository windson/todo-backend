AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  todo-backend delivery building blocks (NOT an automated end-to-end pipeline):
  an encrypted, TLS-only, public-access-blocked S3 artifact bucket; a CodeBuild
  project that runs infra/buildspec.yml (npm ci -> prisma generate -> next build
  -> prisma migrate deploy -> zip -> s3 cp); and a CodeDeploy application
  (ComputePlatform Lambda) kept as a placeholder primitive for a future classic
  AWS::Lambda::Function alias path. There is no AWS::CodePipeline and no
  CodeDeploy DeploymentGroup: the build -> cutover handoff is a manual
  `cloudformation deploy` of the app stack (see infra/CUTOVER.md and the honest
  note on CodeDeployApplication below). No plaintext secrets: CodeBuild reads the
  Aurora master secret at migrate time via secretsmanager:GetSecretValue on the
  specific secret ARN only.

Parameters:
  NetworkStackName:
    Type: String
    Description: Name of the network stack (exports VPC, private subnets + CodeBuild migrate SG for VPC-mode CodeBuild).
  DatabaseStackName:
    Type: String
    Description: Name of the database stack (exports Aurora endpoint + master secret ARN for migrate).
  SourceRepositoryUrl:
    Type: String
    Default: "https://github.com/windson/todo-backend.git"
    Description: Git source cloned by CodeBuild.
  SourceBranch:
    Type: String
    Default: "feat/todo-backend-scaffold"
    Description: Git branch CodeBuild builds from.

Resources:
  ArtifactKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for ${AWS::StackName} build artifacts."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          # The built .zip is encrypted with this CMK. When the app stack creates
          # an AWS::Lambda::WebFunctionRevision from the artifact object, the
          # Lambda Web service principal must be able to decrypt it, otherwise
          # CreateWebFunctionRevision is rejected. Scoped to this account/region.
          - Sid: AllowLambdaWebDecryptArtifacts
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"

  # Server-access log bucket for the artifact bucket (S3_BUCKET_LOGGING_ENABLED).
  # It does not log to itself (that would recurse); this is the standard terminal
  # log-bucket pattern.
  AccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 90

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AccessLogBucket.Arn
              - !Sub "${AccessLogBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: AllowS3LogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: "s3:PutObject"
            Resource: !Sub "${AccessLogBucket.Arn}/*"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ArtifactKmsKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: artifact-access/
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-noncurrent
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Deny any non-TLS access to the bucket (cfn-guard S3 secure-transport rule).
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          # The app stack creates an AWS::Lambda::WebFunctionRevision whose code
          # is the built .zip in this bucket. Lambda Web pulls that object using
          # its service principal, so the bucket policy must grant it read on the
          # artifact objects. Scoped with aws:SourceArn (ArnLike) to Web Function
          # revisions in this account/region; the function name and revision id
          # are wildcarded because the pipeline stack does not know them and
          # Lambda generates the revision id at create time.
          - Sid: AllowLambdaWebFunctionCodeAccess
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/*/revision/*"

  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}"
      RetentionInDays: 365

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CodeBuildLogGroup.Arn}:*"
        - PolicyName: artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt ArtifactKmsKey.Arn
        - PolicyName: vpc-eni
          PolicyDocument:
            Version: "2012-10-17"
            # Permissions CodeBuild VPC mode requires to create/describe/delete
            # the ENIs it places in the private subnets.
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeVpcs
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateNetworkInterfacePermission
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                Condition:
                  StringEquals:
                    ec2:AuthorizedService: codebuild.amazonaws.com
        - PolicyName: read-db-secret-for-migrate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CodeBuild reads ONLY the Aurora master secret to assemble
              # DATABASE_URL for `prisma migrate deploy`. No broad secret access.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: !Sub "${DatabaseStackName}-MasterUserSecretArn"
              # The RDS-managed master secret is encrypted with the data-tier
              # customer-managed KMS key, so GetSecretValue also needs Decrypt on
              # that key. Without this, get-secret-value fails with
              # "Access to KMS is not allowed" and DATABASE_URL is assembled with
              # empty credentials (Prisma then fails with P1010).
              - Effect: Allow
                Action: kms:Decrypt
                Resource:
                  Fn::ImportValue: !Sub "${DatabaseStackName}-DataKmsKeyArn"

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: GITHUB
        Location: !Ref SourceRepositoryUrl
        BuildSpec: infra/buildspec.yml
      SourceVersion: !Ref SourceBranch
      # Run the build inside the VPC so `prisma migrate deploy` can reach the
      # private Aurora cluster on 5432. The CodeBuild SG is allowed by the Aurora
      # SG ingress rule in network.yaml, and a Secrets Manager interface endpoint
      # (also in network.yaml) lets get-secret-value resolve without NAT.
      VpcConfig:
        VpcId:
          Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
        Subnets: !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetIds"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${NetworkStackName}-CodeBuildSgId"
      Artifacts:
        Type: NO_ARTIFACTS
      EncryptionKey: !GetAtt ArtifactKmsKey.Arn
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
        # Only the specific variables each build step needs are declared here.
        # The buildspec never dumps the full environment (no printenv/env/set).
        EnvironmentVariables:
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactBucket
          - Name: AURORA_SECRET_ARN
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub "${DatabaseStackName}-MasterUserSecretArn"
          - Name: DB_HOST
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub "${DatabaseStackName}-ClusterEndpoint"
          - Name: DB_PORT
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub "${DatabaseStackName}-ClusterPort"
          - Name: DB_NAME
            Type: PLAINTEXT
            Value:
              Fn::ImportValue: !Sub "${DatabaseStackName}-DatabaseName"

  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda"

  # HONEST NOTE: this CodeDeploy application is a PLACEHOLDER primitive, not an
  # active deployment controller. It has no AWS::CodeDeploy::DeploymentGroup and
  # nothing invokes a CodeDeploy deployment. Lambda Web Functions shift traffic
  # NATIVELY via the endpoint's RevisionWeights (see app.yaml and
  # infra/CUTOVER.md); classic CodeDeploy Lambda deployment groups operate on
  # the alias of a traditional AWS::Lambda::Function and cannot drive a
  # WebFunctionEndpoint. The application is provisioned so a future classic
  # AWS::Lambda::Function alias path can attach a deployment group to it without
  # re-plumbing; today the cutover is a manual `cloudformation deploy` of the
  # app stack. It is retained to satisfy the "use CodeDeploy" requirement
  # explicitly and transparently, not to imply an automated handoff.
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${AWS::StackName}-app"
      ComputePlatform: Lambda

Outputs:
  ArtifactBucketName:
    Description: Name of the build artifact bucket.
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactBucketName"
  ArtifactKmsKeyArn:
    Description: ARN of the artifact KMS key.
    Value: !GetAtt ArtifactKmsKey.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactKmsKeyArn"
  CodeBuildProjectName:
    Description: Name of the CodeBuild project.
    Value: !Ref CodeBuildProject
    Export:
      Name: !Sub "${AWS::StackName}-CodeBuildProjectName"
  CodeDeployApplicationName:
    Description: Name of the CodeDeploy application.
    Value: !Ref CodeDeployApplication
    Export:
      Name: !Sub "${AWS::StackName}-CodeDeployApplicationName"
