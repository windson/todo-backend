AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  todo-backend data tier: an Aurora PostgreSQL Serverless v2 cluster (engine
  aligned to PostgreSQL 16, encrypted at rest, master credentials managed by RDS
  in Secrets Manager) deployed into the private subnets from the network stack,
  plus the application Secrets Manager secrets for JWT_SECRET and
  REMINDER_DISPATCH_SECRET. No plaintext secret material appears in this
  template: the Aurora master password is generated and stored by RDS
  (ManageMasterUserPassword), and the application secrets are generated by
  Secrets Manager (GenerateSecretString).

Parameters:
  NetworkStackName:
    Type: String
    Description: Name of the network stack that exported the VPC, subnets, and Aurora SG.
  DatabaseName:
    Type: String
    Default: tododb
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    Description: Initial database name created in the Aurora cluster.
  MasterUsername:
    Type: String
    Default: todoadmin
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    Description: Master username for the Aurora cluster (password is generated by RDS in Secrets Manager).
  EngineVersion:
    Type: String
    Default: "16.6"
    Description: >-
      Aurora PostgreSQL engine version (PostgreSQL 16 line, matching
      docker-compose postgres:16). The exact offered patch version varies by
      region and changes over time; confirm an offered value before deploying
      with:
      `aws rds describe-db-engine-versions --engine aurora-postgresql
      --query "DBEngineVersions[?starts_with(EngineVersion,'16.')].EngineVersion"`
      and override this parameter if 16.6 is not offered in your region.
  MinCapacity:
    Type: Number
    Default: 0.5
    Description: Minimum Aurora Serverless v2 capacity (ACUs).
  MaxCapacity:
    Type: Number
    Default: 4
    Description: Maximum Aurora Serverless v2 capacity (ACUs).

Resources:
  # Customer-managed KMS key so Aurora storage, the RDS-managed master secret,
  # and the application secrets are all encrypted with an auditable key.
  DataKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for ${AWS::StackName} Aurora storage and secrets."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  DataKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-data"
      TargetKeyId: !Ref DataKmsKey

  # Role used by RDS Enhanced Monitoring to publish OS metrics to CloudWatch.
  MonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole"

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the Aurora PostgreSQL cluster.
      SubnetIds: !Split
        - ","
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetIds"

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersion
      DatabaseName: !Ref DatabaseName
      MasterUsername: !Ref MasterUsername
      # RDS generates and manages the master password as a Secrets Manager
      # secret; no password ever appears in this template.
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref DataKmsKey
      StorageEncrypted: true
      KmsKeyId: !Ref DataKmsKey
      BackupRetentionPeriod: 7
      DeletionProtection: true
      StorageType: aurora
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
      VpcSecurityGroupIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-AuroraSgId"
      DBSubnetGroupName: !Ref DbSubnetGroup
      EnableCloudwatchLogsExports:
        - postgresql

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref AuroraCluster
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      # Enhanced Monitoring (OS metrics) at 60s satisfies RDS_ENHANCED_MONITORING_ENABLED.
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt MonitoringRole.Arn

  # Application JWT signing secret. Generated once; never plaintext in template.
  # ROTATION: deliberately NOT auto-rotated. Unlike the Aurora master secret
  # (which has a built-in Secrets Manager rotation strategy), JWT_SECRET is an
  # application signing key with no managed HostedRotationLambda strategy;
  # rotating it requires a dual-key grace window in the app so in-flight tokens
  # stay valid. Rotation is therefore an application-level change deferred to a
  # follow-up, not configured here. See infra/README.md ("Secret rotation").
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/jwt-secret"
      Description: JWT signing secret for the todo-backend API (JWT_SECRET). Rotation deferred (see infra/README.md).
      KmsKeyId: !Ref DataKmsKey
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # Shared secret for the reminder dispatch endpoint (X-Dispatch-Secret header).
  # ROTATION: deliberately NOT auto-rotated (same reasoning as JwtSecret above);
  # this is a shared signing/auth secret, not DB credentials, so there is no
  # managed rotation strategy. Rotation is deferred to a follow-up and documented
  # in infra/README.md ("Secret rotation").
  ReminderDispatchSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/reminder-dispatch-secret"
      Description: Shared secret for POST /api/reminders/dispatch (REMINDER_DISPATCH_SECRET). Rotation deferred (see infra/README.md).
      KmsKeyId: !Ref DataKmsKey
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

Outputs:
  ClusterEndpoint:
    Description: Aurora cluster writer endpoint (host for DATABASE_URL).
    Value: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-ClusterEndpoint"
  ClusterPort:
    Description: Aurora cluster port.
    Value: !GetAtt AuroraCluster.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-ClusterPort"
  DatabaseName:
    Description: Initial database name.
    Value: !Ref DatabaseName
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseName"
  MasterUserSecretArn:
    Description: ARN of the RDS-managed master credentials secret (holds username+password).
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-MasterUserSecretArn"
  JwtSecretArn:
    Description: ARN of the JWT_SECRET secret.
    Value: !Ref JwtSecret
    Export:
      Name: !Sub "${AWS::StackName}-JwtSecretArn"
  ReminderDispatchSecretArn:
    Description: ARN of the REMINDER_DISPATCH_SECRET secret.
    Value: !Ref ReminderDispatchSecret
    Export:
      Name: !Sub "${AWS::StackName}-ReminderDispatchSecretArn"
  DataKmsKeyArn:
    Description: ARN of the data/secrets KMS key.
    Value: !GetAtt DataKmsKey.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DataKmsKeyArn"
